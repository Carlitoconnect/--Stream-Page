<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Carlito Connect | Sunday Stream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- TOP PANEL: Replace the placeholder image with your combined Pokémon x Dragon Ball artwork. -->
    <section class="panel artwork-panel" aria-label="Pokémon X Dragon Ball artwork">
      <img
        class="stream-artwork"
        src="images/pokemon-dragonball-placeholder.svg"
        alt="Pokémon X Dragon Ball"
      >
    </section>

    <!-- VIDEO PANEL: Put your MP4 in the videos folder and name it stream-intro.mp4. -->
    <section class="panel video-panel" aria-label="Stream introduction video">
      <video class="intro-video" controls playsinline preload="metadata">
        <source src="videos/stream-intro.mp4" type="video/mp4">
        Your browser does not support HTML video.
      </video>
      <p class="video-note">Add your introduction video as <strong>videos/stream-intro.mp4</strong>.</p>
    </section>

    <!-- STREAM DETAILS -->
    <section class="panel stream-details" aria-label="Sunday stream details">
      <h1>Sunday 8pm</h1>
      <p>Sealed</p>
      <p>Slabs</p>
      <p>Raw Singles</p>
    </section>

    <!-- SMALL BRAND LOGO: Keep this compact at the bottom of the page. -->
    <footer class="site-footer">
      <img src="images/carlito-logo.png" alt="Carlito Connect">
    </footer>

  </main>
</body>
</html>
