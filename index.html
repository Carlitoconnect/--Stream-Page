<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Carlito Connect | Live Stream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- TOP IMAGE SLOT: Replace images/top-banner.png with your own image. Keep the same filename. -->
    <section class="panel artwork-panel" aria-label="Stream artwork">
      <img
        class="stream-artwork"
        src="images/top-banner.png"
        alt="Your stream banner"
      >
    </section>

    <!-- VIDEO PANEL: Put your MP4 in the videos folder and name it stream-intro.mp4. -->
    <section class="panel video-panel" aria-label="Stream introduction video">
      <video class="intro-video" controls playsinline preload="metadata">
        <source src="videos/stream-intro.mp4" type="video/mp4">
        Your browser does not support HTML video.
      </video>
      <p class="video-note">Add your introduction video as <strong>videos/stream-intro.mp4</strong>.</p>
    </section>

    <!-- STREAM DETAILS -->
    <section class="panel stream-details" aria-label="Monday stream details">
      <h1>Monday 9.30pm</h1>
      <p class="stream-line">Rip N Ship</p>
      <p class="stream-line">eBay Live</p>
      <p class="stream-line one-pound-start">£1 Starts</p>
    </section>

    <!-- SMALL BRAND LOGO: Keep this compact at the bottom of the page. -->
    <footer class="site-footer">
      <img src="images/carlito-logo.png" alt="Carlito Connect">
    </footer>

  </main>
</body>
</html>
